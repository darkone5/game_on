<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasure Hunt Game On</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; color: #ffd700; }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 1000px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .player-color { color: #00d2ff; }
    .pause-btn {
      background: #444;
      color: #ffd700;
      border: 2px solid #ffd700;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .pause-btn:hover {
      background: #555;
    }
    .game-container {
      position: relative;
      width: 1000px;
      height: 650px;
    }
    canvas {
      border: 4px solid #2e8b57;
      background-color: #5c4033;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    /* Full-Screen In-Game Menu Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      z-index: 1000;
    }
    .overlay.hidden {
      display: none;
    }
    .overlay-title {
      font-size: 42px;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 15px;
      text-align: center;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }
    .overlay-message {
      font-size: 22px;
      color: #eee;
      margin-bottom: 30px;
      text-align: center;
      white-space: pre-line;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 15px;
    }
    .overlay-btn {
      background: #ffd700;
      color: #1a1a1a;
      border: none;
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.1s, background-color 0.2s;
    }
    .overlay-btn:hover {
      background: #ffae00;
      transform: scale(1.05);
    }
    .overlay-btn.secondary {
      background: #555;
      color: #fff;
    }
    .overlay-btn.secondary:hover {
      background: #666;
    }
    .controls {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>🏴‍☠️ Treasure Hunt 🏴‍☠️</h1>
  
  <div class="hud">
    <div class="player-color">
      Score: <span id="p-score">0</span> | HP: <span id="p-hp">100</span> | Lives: <span id="p-lives">3</span>
    </div>
    <div>Level: <span id="level-display">1</span> / 3</div>
    <div>
      <button class="pause-btn" onclick="togglePauseMenu()">⏸ Pause (Esc)</button>
    </div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="1000" height="650"></canvas>
  </div>

  <!-- Full-Screen Modal Menu Overlay -->
  <div id="gameOverlay" class="overlay hidden">
    <div id="overlayTitle" class="overlay-title">Level Cleared!</div>
    <div id="overlayMessage" class="overlay-message">Get ready for the next level.</div>

    <div id="overlayBtnContainer" class="btn-group">
      <button id="overlayBtn" class="overlay-btn" onclick="closeOverlay()">Continue</button>
    </div>
  </div>

  <div class="controls">
    Controls: <b>W, A, S, D</b> or <b>Arrow Keys</b> to move player | <b>ESC</b> to Pause game | <b>Enter</b> to confirm menu
  </div>

  <!-- Gemini Auto at 10:56:08 PM Wednesday 11 November 2026 did the following line below, nothing else according to my double checking-->
  <script src="game.js"></script>
</body>
</html>
