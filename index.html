<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasure Hunt Game On</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; color: #ffd700; }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 1000px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .player-color { color: #00d2ff; }
    .pause-btn {
      background: #444;
      color: #ffd700;
      border: 2px solid #ffd700;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .pause-btn:hover {
      background: #555;
    }
    .game-container {
      position: relative;
      width: 1000px;
      height: 650px;
    }
    canvas {
      border: 4px solid #2e8b57;
      background-color: #5c4033;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    /* In-Game Menu Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1000px;
      height: 650px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 4px solid #444;
      box-sizing: border-box;
      z-index: 10;
    }
    .overlay.hidden {
      display: none;
    }
    .overlay-title {
      font-size: 36px;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 15px;
      text-align: center;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }
    .overlay-message {
      font-size: 20px;
      color: #eee;
      margin-bottom: 25px;
      text-align: center;
      white-space: pre-line;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 15px;
    }
    .overlay-btn {
      background: #ffd700;
      color: #1a1a1a;
      border: none;
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.1s, background-color 0.2s;
    }
    .overlay-btn:hover {
      background: #ffae00;
      transform: scale(1.05);
    }
    .overlay-btn.secondary {
      background: #555;
      color: #fff;
    }
    .overlay-btn.secondary:hover {
      background: #666;
    }
    .controls {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>🏴‍☠️ Treasure Hunt 🏴‍☠️</h1>
  
  <div class="hud">
    <div class="player-color">
      Score: <span id="p-score">0</span> | HP: <span id="p-hp">100</span> | Lives: <span id="p-lives">3</span>
    </div>
    <div>Level: <span id="level-display">1</span> / 3</div>
    <div>
      <button class="pause-btn" onclick="togglePauseMenu()">⏸ Pause (Esc)</button>
    </div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="1000" height="650"></canvas>
    
    <!-- Modal Menu -->
    <div id="gameOverlay" class="overlay hidden">
      <div id="overlayTitle" class="overlay-title">Level Cleared!</div>
      <div id="overlayMessage" class="overlay-message">Get ready for the next level.</div>

      <div id="overlayBtnContainer" class="btn-group">
        <button id="overlayBtn" class="overlay-btn" onclick="closeOverlay()">Continue</button>
      </div>
    </div>
  </div>

  <div class="controls">
    Controls: <b>W, A, S, D</b> or <b>Arrow Keys</b> to move player | <b>ESC</b> to Pause game | <b>Enter</b> to confirm menu
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Audio Setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(freq, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    // Input state
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === 'Escape') {
        togglePauseMenu();
      }
      
      if (e.key === 'Enter') {
        const overlay = document.getElementById('gameOverlay');
        if (!overlay.classList.contains('hidden')) {
          const primaryBtn = overlay.querySelector('.overlay-btn');
          if (primaryBtn) {
            primaryBtn.click();
          }
        }
      }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Game state variables
    let currentLevel = 1;
    let treasures = [];
    let traps = [];
    let staticObstacles = [];
    let isPaused = false;
    let isManualPause = false;
    let pendingAction = null;

    // Overlay Management
    function showOverlay(title, message, buttonsConfig) {
      isPaused = true;
      document.getElementById('overlayTitle').innerText = title;
      document.getElementById('overlayMessage').innerText = message;

      const btnContainer = document.getElementById('overlayBtnContainer');
      btnContainer.innerHTML = ''; 

      buttonsConfig.forEach(btnInfo => {
        const btn = document.createElement('button');
        btn.innerText = btnInfo.text;
        btn.className = `overlay-btn ${btnInfo.class || ''}`;
        btn.onclick = btnInfo.onClick;
        btnContainer.appendChild(btn);
      });

      document.getElementById('gameOverlay').classList.remove('hidden');
    }

    function closeOverlay() {
      document.getElementById('gameOverlay').classList.add('hidden');
      isPaused = false;
      isManualPause = false;
      if (pendingAction) {
        const action = pendingAction;
        pendingAction = null;
        action();
      }
    }

    function togglePauseMenu() {
      const overlay = document.getElementById('gameOverlay');
      if (!overlay.classList.contains('hidden') && !isManualPause) {
        return; 
      }

      if (isPaused && isManualPause) {
        closeOverlay();
      } else if (!isPaused) {
        isPaused = true;
        isManualPause = true;
        showOverlay(
          "⏸ Game Paused",
          `Current Level: ${currentLevel}`,
          [
            { text: "Resume", class: "", onClick: () => closeOverlay() },
            { 
              text: "Restart from Level 1", 
              class: "secondary", 
              onClick: () => {
                closeOverlay();
                player.fullReset();
                initLevel(1);
              } 
            }
          ]
        );
      }
    }

    // Player class
    class Player {
      constructor() {
        this.size = 26;
        this.startX = (canvas.width / 2) - (this.size / 2);
        this.startY = (canvas.height / 2) - (this.size / 2);
        this.x = this.startX;
        this.y = this.startY;
        this.color = '#00d2ff';
        this.speed = 4.5;
        this.score = 0;
        this.hp = 100;
        this.lives = 3;
        this.isProtected = true; 
      }

      resetPos() {
        this.x = this.startX;
        this.y = this.startY;
        this.isProtected = true; 
      }

      fullReset() {
        this.score = 0;
        this.hp = 100;
        this.lives = 3;
        this.resetPos();
      }

      update() {
        if (isPaused) return;

        let dx = 0;
        let dy = 0;
        let isMoving = false;

        if (keys['w'] || keys['W'] || keys['ArrowUp']) { dy -= this.speed; isMoving = true; }
        if (keys['s'] || keys['S'] || keys['ArrowDown']) { dy += this.speed; isMoving = true; }
        if (keys['a'] || keys['A'] || keys['ArrowLeft']) { dx -= this.speed; isMoving = true; }
        if (keys['d'] || keys['D'] || keys['ArrowRight']) { dx += this.speed; isMoving = true; }

        if (isMoving) {
          this.isProtected = false;
        }

        if (dx !== 0 || dy !== 0) {
          this.x += dx;
          if (this.x < 0 || this.x > canvas.width - this.size || checkShapeCollision(this.x, this.y, this.size, this.size)) {
            this.x -= dx;
          }

          this.y += dy;
          if (this.y < 0 || this.y > canvas.height - this.size || checkShapeCollision(this.x, this.y, this.size, this.size)) {
            this.y -= dy;
          }
        }
      }

      draw() {
        if (this.isProtected && Math.floor(Date.now() / 150) % 2 === 0) {
          ctx.fillStyle = '#ffffff'; 
        } else {
          ctx.fillStyle = this.color;
        }

        ctx.beginPath();
        ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        if (this.isProtected) {
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2 + 4, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    const player = new Player();

    function checkShapeCollision(x, y, w, h) {
      for (let obs of staticObstacles) {
        if (x < obs.x + obs.size && x + w > obs.x &&
            y < obs.y + obs.size && y + h > obs.y) {
          return true;
        }
      }
      return false;
    }

    function initLevel(lvl) {
      currentLevel = lvl;
      document.getElementById('level-display').innerText = currentLevel;
      player.resetPos();

      // Update background and border colors per level
      if (lvl === 1) {
        canvas.style.backgroundColor = '#5c4033'; 
        canvas.style.border = '4px solid #2e8b57'; 
      } else if (lvl === 2) {
        canvas.style.backgroundColor = '#d4ac0d'; 
        canvas.style.border = '4px solid #ffeb3b'; 
      } else if (lvl === 3) {
        canvas.style.backgroundColor = '#b3e5fc'; 
        canvas.style.border = '4px solid #0288d1'; 
      }

      // Static obstacles: Level 1 = 5, Level 2 = 15, Level 3 = 25
      staticObstacles = [];
      let obstacleCount = 5;
      if (lvl === 2) obstacleCount = 15;
      if (lvl === 3) obstacleCount = 25;

      for (let i = 0; i < obstacleCount; i++) {
        let obsX, obsY, obsSize;
        let attempts = 0;
        let valid = false;

        do {
          obsSize = 32; 
          obsX = Math.random() * (canvas.width - 100) + 50;
          obsY = Math.random() * (canvas.height - 100) + 50;

          const centerBuffer = (obsX < player.startX + 50 && obsX + obsSize > player.startX - 50 && 
                                obsY < player.startY + 50 && obsY + obsSize > player.startY - 50);

          if (!centerBuffer) {
            valid = true;
          }
          attempts++;
          if (attempts > 100) break;
        } while (!valid);

        staticObstacles.push({
          x: obsX,
          y: obsY,
          size: obsSize
        });
      }

      // Generate treasures
      treasures = [];
      const treasureCount = 10 + (lvl - 1) * 10; 

      for (let i = 0; i < treasureCount; i++) {
        let tX, tY, overlapping;
        let attempts = 0;

        const rand = Math.random();
        let tColor, tPoints, tRadius;

        if (lvl === 1) {
          if (rand < 0.60) {
            tColor = '#cd7f32'; tPoints = 10; tRadius = 8;  // Bronze
          } else {
            tColor = '#c0c0c0'; tPoints = 20; tRadius = 9;  // Silver
          }
        } else if (lvl === 2) {
          if (rand < 0.50) {
            tColor = '#cd7f32'; tPoints = 10; tRadius = 8;  // Bronze
          } else if (rand < 0.80) {
            tColor = '#c0c0c0'; tPoints = 20; tRadius = 9;  // Silver
          } else {
            tColor = '#ffd700'; tPoints = 35; tRadius = 10; // Gold
          }
        } else {
          if (rand < 0.50) {
            tColor = '#cd7f32'; tPoints = 10; tRadius = 8;  // Bronze
          } else if (rand < 0.75) {
            tColor = '#c0c0c0'; tPoints = 20; tRadius = 9;  // Silver
          } else if (rand < 0.90) {
            tColor = '#ffd700'; tPoints = 35; tRadius = 10; // Gold
          } else {
            tColor = '#b9f2ff'; tPoints = 50; tRadius = 12; // Diamond
          }
        }

        do {
          tX = Math.random() * (canvas.width - 60) + 30;
          tY = Math.random() * (canvas.height - 60) + 30;
          overlapping = checkShapeCollision(tX - tRadius, tY - tRadius, tRadius * 2, tRadius * 2);
          attempts++;
          if (attempts > 500) break; 
        } while (overlapping);

        treasures.push({
          x: tX,
          y: tY,
          radius: tRadius,
          points: tPoints,
          color: tColor
        });
      }

      // Moving Traps / Enemies
      traps = [];
      if (lvl === 2) {
        for (let i = 0; i < 4; i++) {
          traps.push({
            x: Math.random() * (canvas.width - 80) + 40,
            y: Math.random() * (canvas.height - 80) + 40,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            size: 20,
            type: 'red',
            damage: 0.55 
          });
        }
      } else if (lvl === 3) {
        for (let i = 0; i < 8; i++) {
          const isBlue = i % 2 === 0;
          traps.push({
            x: Math.random() * (canvas.width - 80) + 40,
            y: Math.random() * (canvas.height - 80) + 40,
            vx: (Math.random() - 0.5) * (isBlue ? 5 : 4.5),
            vy: (Math.random() - 0.5) * (isBlue ? 5 : 4.5),
            size: isBlue ? 22 : 20,
            type: isBlue ? 'blue' : 'red',
            damage: isBlue ? 0.833 : 0.55 
          });
        }
      }
    }

    function checkCollision(circle1, circle2) {
      const dx = (circle1.x + (circle1.size ? circle1.size/2 : 0)) - circle2.x;
      const dy = (circle1.y + (circle1.size ? circle1.size/2 : 0)) - circle2.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const r1 = circle1.size ? circle1.size/2 : circle1.radius;
      const r2 = circle2.size ? circle2.size/2 : circle2.radius;
      return distance < (r1 + r2);
    }

    function handlePlayerDeath() {
      player.lives--;
      playSound(100, 0.1);
      if (player.lives > 0) {
        showOverlay(
          `⚠️ You Lost a Life! ⚠️`, 
          `Remaining Lives: ${player.lives}`, 
          [
            { text: "Continue", onClick: () => { player.hp = 100; player.resetPos(); closeOverlay(); } }
          ]
        );
      } else {
        showOverlay(
          `❌ Game Over! ❌`, 
          "All 3 lives lost. Restarting game back to Level 1.", 
          [
            { text: "Try Again", onClick: () => { player.fullReset(); initLevel(1); closeOverlay(); } }
          ]
        );
      }
    }

    function update() {
      if (isPaused) return;

      player.update();

      // Moving traps updates
      traps.forEach(trap => {
        trap.x += trap.vx;
        trap.y += trap.vy;
        if (trap.x < 0 || trap.x > canvas.width - trap.size) trap.vx *= -1;
        if (trap.y < 0 || trap.y > canvas.height - trap.size) trap.vy *= -1;

        if (!player.isProtected && checkCollision(player, {x: trap.x + trap.size/2, y: trap.y + trap.size/2, radius: trap.size/2})) {
          player.hp -= trap.damage;
          playSound(trap.type === 'blue' ? 160 : 130, 0.04);
          if (player.hp <= 0) handlePlayerDeath();
        }
      });

      // Treasure collection
      treasures.forEach((t, index) => {
        if (checkCollision(player, t)) {
          player.score += t.points;
          playSound(500 + t.points * 4, 0.08);
          treasures.splice(index, 1);
        }
      });

      // Level progression
      if (treasures.length === 0) {
        if (currentLevel < 3) {
          showOverlay(
            `🏆 Level ${currentLevel} Cleared! 🏆`, 
            `Advancing to Level ${currentLevel + 1}...`, 
            [
              { text: "Next Level", onClick: () => { initLevel(currentLevel + 1); closeOverlay(); } }
            ]
          );
        } else {
          showOverlay(
            `🎉 VICTORY! 🎉`, 
            `Game Complete!\n\nFinal Score: ${player.score}`, 
            [
              { text: "Play Again", onClick: () => { player.fullReset(); initLevel(1); closeOverlay(); } }
            ]
          );
        }
      }

      // Update HUD Display
      document.getElementById('p-score').innerText = player.score;
      document.getElementById('p-hp').innerText = Math.max(0, Math.floor(player.hp));
      document.getElementById('p-lives').innerText = player.lives;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw static obstacles as emoji sprites per level
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      staticObstacles.forEach(obs => {
        let sprite = '🌲'; 
        if (currentLevel === 2) sprite = '🌵'; 
        if (currentLevel === 3) sprite = '🧊'; 

        if (currentLevel === 2) {
          ctx.fillStyle = '#f1c40f'; 
        } else {
          ctx.fillStyle = '#ffffff';
        }

        const displaySprite = (currentLevel === 2) ? '🔺' : sprite;
        ctx.fillText(displaySprite, obs.x + obs.size/2, obs.y + obs.size/2);
      });

      // Draw treasures
      treasures.forEach(t => {
        ctx.fillStyle = t.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw traps / enemies
      traps.forEach(t => {
        if (t.type === 'blue') {
          ctx.fillStyle = '#0055ff';
          ctx.strokeStyle = '#0022aa';
        } else {
          ctx.fillStyle = '#ff3333';
          ctx.strokeStyle = '#990000';
        }
        ctx.fillRect(t.x, t.y, t.size, t.size);
        ctx.strokeRect(t.x, t.y, t.size, t.size);
      });

      // Draw player
      player.draw();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    initLevel(1);
    gameLoop();
  </script>
</body>
</html>
